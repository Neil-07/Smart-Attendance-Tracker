<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students - Smart Attendance Tracker</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        .remove-btn {
            background-color: #EF4444;
            color: white;
            padding: 5px 10px;
            border-radius: var(--border-radius);
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>
<div class="dashboard-layout">

    <div class="sidebar">
        <h2>Dashboard</h2>
        <ul>
            <li><a href="teacher.html">Dashboard</a></li>
            <li><a href="view-student-attendance.html">View Student Attendance</a></li>
            <li><a href="manage-students.html" class="active">Manage Students</a></li>
            <li><a href="generate-teacher-reports.html">Generate Reports</a></li>
            <li><a href="generate-qr.html">Generate QR Code</a></li>
        </ul>
    </div>

    <div class="main-content">
        <header>
            <!-- Added: mobile sidebar toggle -->
            <div class="menu-toggle">
                <div class="hamburger"></div>
            </div>
            <nav class="nav-links">
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a href="help.html">Help</a>
                <a href="index.html">Logout</a>
            </nav>
        </header>

        <div class="content">

            <h1>Manage Students</h1>

            <!-- ADD STUDENT -->
            <div class="card">
                <h2>Add New Student</h2>

                <form id="add-student-form">
                    <div class="input-group">
                        <label>Name</label>
                        <input type="text" id="student-name" required>
                    </div>

                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" id="student-email" required>
                    </div>

                    <div class="input-group">
                        <label>Department</label>
                        <select id="student-department">
                            <option value="Computer Science">Computer Science</option>
                            <option value="IT">IT</option>
                            <option value="EXTC">EXTC</option>
                        </select>
                    </div>

                    <button type="submit" class="btn">Add Student</button>
                </form>
            </div>

            <!-- STUDENT LIST -->
            <div class="card">
                <h2>Student List</h2>

                <table width="100%">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="student-table-body"></tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<!-- SCRIPT -->
<script type="module">
import { db } from "./js/firebase.js";
import { collection, addDoc, getDocs, deleteDoc, doc, query, where } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const form = document.getElementById("add-student-form");
const tableBody = document.getElementById("student-table-body");

// LOAD STUDENTS
async function loadStudents() {
    const snapshot = await getDocs(collection(db, "users"));

    tableBody.innerHTML = "";

    snapshot.forEach(docSnap => {
        const data = docSnap.data();

        if (data.role !== "student") return;

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${data.name}</td>
            <td>${data.email}</td>
            <td>${data.department || "-"}</td>
            <td>
                <button class="remove-btn" onclick="deleteStudent('${docSnap.id}')">
                    Delete
                </button>
            </td>
        `;

        tableBody.appendChild(row);
    });
}

// ADD STUDENT
form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const name = document.getElementById("student-name").value;
    const email = document.getElementById("student-email").value;
    const department = document.getElementById("student-department").value;

    // CHECK DUPLICATE
    const q = query(collection(db, "users"), where("email", "==", email));
    const existing = await getDocs(q);

    if (!existing.empty) {
        alert("Student already exists");
        return;
    }

    await addDoc(collection(db, "users"), {
        name,
        email,
        department,
        role: "student",
        createdAt: new Date()
    });

    alert("Student added");

    form.reset();
    loadStudents();
});

// DELETE STUDENT
window.deleteStudent = async function (id) {
    if (!confirm("Delete this student?")) return;

    await deleteDoc(doc(db, "users", id));
    loadStudents();
};

// INIT
loadStudents();
</script>

<script src="js/main.js"></script>

</body>
</html>
