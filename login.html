<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Attendance Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Welcome Back!</h1>
        <h2>Login to your account</h2>
        <form id="login-form">
            <div class="input-group">
                <label for="role">You are a:</label>
                <select id="role" name="role" required>
                    <option value="" disabled selected>Select your role</option>
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="login-email" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="login-password" required>
            </div>
            <p style="margin-top: 10px;">
                <a href="#" onclick="resetPassword()">Forgot Password?</a>
            </p>
            <button type="button" id="login-btn" class="btn">Login</button>
        </form>
        <p style="margin-top: 20px;">Don't have an account? <a href="signup.html">Sign Up</a></p>
    </div>
    
    <script type="module" src="js/auth.js"></script>
</body>
</html>
