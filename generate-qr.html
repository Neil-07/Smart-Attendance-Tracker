<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate QR Code - Smart Attendance Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<div class="dashboard-layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2>Dashboard</h2>
        <ul>
            <li><a href="teacher.html">Dashboard</a></li>
            <li><a href="view-student-attendance.html">View Student Attendance</a></li>
            <li><a href="manage-students.html">Manage Students</a></li>
            <li><a href="generate-teacher-reports.html">Generate Reports</a></li>
            <li><a href="generate-qr.html" class="active">Generate QR Code</a></li>
        </ul>
    </div>

    <!-- MAIN -->
    <div class="main-content">
        <header>
            <div class="menu-toggle">
                <div class="hamburger"></div>
            </div>

            <nav class="nav-links">
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a href="help.html">Help</a>
                <a href="index.html">Logout</a>
            </nav>
        </header>

        <div class="content">
            <h1>Generate QR for Attendance</h1>

            <div class="card">
                <div class="input-group" style="text-align: left; max-width: 300px; margin: 0 auto 20px;">
                    <label for="subject-select">Select Subject</label>
                    <select id="subject-select">
                        <option value="">-- Select Subject --</option>
                    </select>
                </div>

                <img id="qr-code-image" src="/images/qrcode.svg" alt="QR Code">

                <div class="qr-actions">
                    <button onclick="generateQR()">Generate QR</button>
                </div>

                <p class="qr-note">
                    Students scan this QR to mark attendance.
                </p>

            </div>
        </div>
    </div>

</div>

<script type="module">

import { getAuth, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    collection,
    addDoc,
    doc,
    getDoc,
    updateDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { db } from "./js/firebase.js";

const auth = getAuth();

// Fetch subjects on load
onAuthStateChanged(auth, async (user) => {
    if (!user) return;
    
    const subjectSelect = document.getElementById("subject-select");
    try {
        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);
        
        if (userSnap.exists()) {
            const userData = userSnap.data();
            const subjects = new Set();
            
            // Add subjects assigned to teacher
            if (userData.subjects) {
                userData.subjects.split(",").forEach(s => subjects.add(s.trim()));
            }
            
            // Also add subjects from timetable
            const timetableRef = doc(db, "timetable", "week1");
            const timetableSnap = await getDoc(timetableRef);
            if (timetableSnap.exists()) {
                const timetableData = timetableSnap.data();
                Object.values(timetableData).forEach(s => {
                    if (s && s !== "-" && s !== "Short Break" && s !== "Lunch Break") {
                        subjects.add(s.trim());
                    }
                });
            }
            
            subjects.forEach(subject => {
                const option = document.createElement("option");
                option.value = subject;
                option.textContent = subject;
                subjectSelect.appendChild(option);
            });
        }
    } catch (error) {
        console.error("Error fetching subjects:", error);
    }
});

window.generateQR = async function () {

    const user = auth.currentUser;
    const subject = document.getElementById("subject-select").value;

    if (!user) {
        alert("Login first");
        return;
    }

    if (!subject) {
        alert("Please select a subject");
        return;
    }

    // QR VALID FOR 45 SECONDS
    const startTime = new Date();

    const endTime =
        new Date(startTime.getTime() + 45 * 1000);

    try {

        const userRef =
            doc(db, "users", user.uid);

        const userSnap =
            await getDoc(userRef);

        if (!userSnap.exists()) {

            alert("Teacher data not found");
            return;
        }

        const teacherData =
            userSnap.data();

        if (!teacherData.department) {

            alert("Teacher department missing");
            return;
        }

        navigator.geolocation.getCurrentPosition(

            async (position) => {

                const teacherLat =
                    position.coords.latitude;

                const teacherLng =
                    position.coords.longitude;

                try {

                    // CREATE SESSION
                    const docRef =
                        await addDoc(
                            collection(db, "sessions"),
                            {
                                teacherId: user.uid,
                                subject: subject,
                                startTime: startTime,
                                endTime: endTime,
                                isActive: true,
                                teacherLat: teacherLat,
                                teacherLng: teacherLng,
                                department: teacherData.department
                            }
                        );

                    const sessionId =
                        docRef.id;

                    // QR DATA
                    const qrData =
                        `${window.location.origin}/attendance.html?session=${sessionId}`;

                    // GENERATE QR IMAGE
                    document.getElementById(
                        "qr-code-image"
                    ).src =
                    `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(qrData)}`;

                    alert("QR Generated Successfully");

                    // AUTO EXPIRE AFTER 45 SEC
                    setTimeout(async () => {

                        try {

                            await updateDoc(
                                doc(db, "sessions", sessionId),
                                {
                                    isActive: false
                                }
                            );

                            // REMOVE QR IMAGE
                            document.getElementById(
                                "qr-code-image"
                            ).src = "";

                            alert("QR Session Expired");

                        } catch (error) {

                            console.error(error);
                        }

                    }, 45000);

                } catch (error) {

                    console.error(error);
                    alert("Error creating session");
                }

            },

            () => {

                alert("Location permission required");
            }
        );

    } catch (error) {

        console.error(error);
        alert("Error fetching teacher data");
    }
};

</script> 

<script src="js/main.js"></script>

</body>
</html>
