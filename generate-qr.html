<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate QR Code - Smart Attendance Tracker</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<div class="dashboard-layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2>Dashboard</h2>
        <ul>
            <li><a href="teacher.html">Dashboard</a></li>
            <li><a href="view-student-attendance.html">View Student Attendance</a></li>
            <li><a href="manage-students.html">Manage Students</a></li>
            <li><a href="generate-teacher-reports.html">Generate Reports</a></li>
            <li><a href="generate-qr.html" class="active">Generate QR Code</a></li>
        </ul>
    </div>

    <!-- MAIN -->
    <div class="main-content">
        <header>
            <div class="menu-toggle">
                <div class="hamburger"></div>
            </div>

            <nav class="nav-links">
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a href="help.html">Help</a>
                <a href="index.html">Logout</a>
            </nav>
        </header>

        <div class="content">
            <h1>Generate QR for Attendance</h1>

            <div class="card">

                <img id="qr-code-image" src="/images/qrcode.svg" alt="QR Code">

                <div class="qr-actions">
                    <button onclick="generateQR()">Generate QR</button>
                </div>

                <p class="qr-note">
                    Students scan this QR to mark attendance.
                </p>

            </div>
        </div>
    </div>

</div>

<script type="module">

import { getAuth } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    collection,
    addDoc,
    doc,
    getDoc,
    updateDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { db } from "./js/firebase.js";

const auth = getAuth();

window.generateQR = async function () {

    const user = auth.currentUser;

    if (!user) {

        alert("Login first");
        return;
    }

    // QR VALID FOR 45 SECONDS
    const startTime = new Date();

    const endTime =
        new Date(startTime.getTime() + 45 * 1000);

    try {

        const userRef =
            doc(db, "users", user.uid);

        const userSnap =
            await getDoc(userRef);

        if (!userSnap.exists()) {

            alert("Teacher data not found");
            return;
        }

        const teacherData =
            userSnap.data();

        if (!teacherData.department) {

            alert("Teacher department missing");
            return;
        }

        navigator.geolocation.getCurrentPosition(

            async (position) => {

                const teacherLat =
                    position.coords.latitude;

                const teacherLng =
                    position.coords.longitude;

                try {

                    // CREATE SESSION
                    const docRef =
                        await addDoc(
                            collection(db, "sessions"),
                            {
                                teacherId: user.uid,
                                startTime: startTime,
                                endTime: endTime,
                                isActive: true,
                                teacherLat: teacherLat,
                                teacherLng: teacherLng,
                                department: teacherData.department
                            }
                        );

                    const sessionId =
                        docRef.id;

                    // QR DATA
                    const qrData =
                        `${window.location.origin}/attendance.html?session=${sessionId}`;

                    // GENERATE QR IMAGE
                    document.getElementById(
                        "qr-code-image"
                    ).src =
                    `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(qrData)}`;

                    alert("QR Generated Successfully");

                    // AUTO EXPIRE AFTER 45 SEC
                    setTimeout(async () => {

                        try {

                            await updateDoc(
                                doc(db, "sessions", sessionId),
                                {
                                    isActive: false
                                }
                            );

                            // REMOVE QR IMAGE
                            document.getElementById(
                                "qr-code-image"
                            ).src = "";

                            alert("QR Session Expired");

                        } catch (error) {

                            console.error(error);
                        }

                    }, 45000);

                } catch (error) {

                    console.error(error);
                    alert("Error creating session");
                }

            },

            () => {

                alert("Location permission required");
            }
        );

    } catch (error) {

        console.error(error);
        alert("Error fetching teacher data");
    }
};

</script> 

<script src="js/main.js"></script>

</body>
</html>
